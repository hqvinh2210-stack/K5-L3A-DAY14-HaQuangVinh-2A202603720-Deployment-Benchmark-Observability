# Load this file after docker-compose.yml to run the optional scaling demo.
services:
  agent:
    ports: !reset []
    environment:
      PORT: 8000
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    deploy:
      replicas: 3

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent
