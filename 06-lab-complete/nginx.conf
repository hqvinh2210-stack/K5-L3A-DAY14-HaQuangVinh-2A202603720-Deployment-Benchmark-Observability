resolver 127.0.0.11 valid=5s ipv6=off;

upstream agent_pool {
    zone agent_pool 64k;
    server agent:8000 resolve;
    keepalive 16;
}

server {
    listen 80;

    location / {
        proxy_pass http://agent_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Served-By $upstream_addr always;
    }
}
