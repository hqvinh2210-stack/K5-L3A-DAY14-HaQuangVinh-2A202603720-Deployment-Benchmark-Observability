services:
  agent:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: ${PORT:-8000}
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
